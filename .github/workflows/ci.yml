name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Run tests with an explicit file list so it works on Node 20 too
      # (positional glob support in `node --test` requires Node >= 21).
      - name: Test
        run: node --test $(find dist -name '*.test.js')

      - name: Render the example (smoke)
        run: node dist/cli.js render examples/commute-plus.json --out .archlens --svg --mermaid
